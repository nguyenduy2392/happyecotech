name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nguyenduy2392/happyecotech
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Chặn deploy nếu image dùng PHP < 8.3.36 (CVE-2026-109618 / CVE-2026-109619)
      - name: Verify PHP version
        run: docker run --rm --entrypoint php ${{ steps.meta.outputs.tags }} -r 'exit(PHP_VERSION_ID >= 80336 ? 0 : 1);'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/eco
            sed -i "s/^SERVICE_TAG_HAPPY_ECOTECH=.*/SERVICE_TAG_HAPPY_ECOTECH=${{ env.IMAGE_TAG }}/" .env  # cập nhật SERVICE_TAG trong file .env
            docker-compose -f docker-compose.prod.yml pull happy-ecotech
            docker-compose -f docker-compose.prod.yml up -d happy-ecotech
            docker-compose -f docker-compose.prod.yml exec gateway nginx -s reload # reload nginx để áp dụng thay đổi nếu cần